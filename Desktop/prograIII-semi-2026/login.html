<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef1f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0
        }

        .caja {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #0003;
            width: 300px
        }

        h2 {
            text-align: center;
            margin-top: 0
        }

        label {
            display: block;
            margin-top: 12px
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            margin-top: 4px
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 10px;
            background: #1565c0;
            color: #fff;
            border: 0;
            border-radius: 4px;
            cursor: pointer
        }

        #msg {
            color: #c62828;
            text-align: center;
            margin-top: 12px;
            min-height: 20px
        }
    </style>
</head>

<body>
    <div class="caja">
        <h2>Iniciar sesión</h2>
        <label>Usuario</label>
        <input type="text" id="usuario" maxlength="35">
        <label>Clave</label>
        <input type="password" id="clave" maxlength="35">
        <button id="btnLogin">Ingresar</button>
        <div id="msg"></div>
    </div>
    <script src="login.js"></script>
</body>

</html>
