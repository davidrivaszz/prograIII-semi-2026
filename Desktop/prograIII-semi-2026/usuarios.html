<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef1f5;
            margin: 0;
            padding: 20px
        }

        .barra {
            max-width: 860px;
            margin: 0 auto 15px;
            text-align: right
        }

        .caja {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #0003;
            max-width: 860px;
            margin: 0 auto 20px
        }

        h2 {
            margin-top: 0
        }

        .fila {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px
        }

        label {
            display: block;
            font-size: 14px
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            margin-top: 4px
        }

        button {
            padding: 8px 16px;
            border: 0;
            border-radius: 4px;
            cursor: pointer;
            color: #fff;
            margin-right: 6px;
            margin-top: 12px
        }

        .azul {
            background: #1565c0
        }

        .gris {
            background: #757575
        }

        .verde {
            background: #2e7d32
        }

        .rojo {
            background: #c62828
        }

        .naranja {
            background: #ef6c00
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px
        }

        th,
        td {
            border-bottom: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            font-size: 14px
        }

        th {
            background: #f5f5f5
        }

        td button {
            margin-top: 0;
            padding: 5px 10px
        }

        #msg {
            margin-top: 10px;
            font-weight: bold
        }

        a {
            color: #c62828;
            text-decoration: none;
            font-weight: bold
        }
    </style>
</head>

<body>
    <div class="barra"><a href="/logout">Cerrar sesión</a></div>

    <div class="caja">
        <h2>Registro de usuarios</h2>
        <input type="hidden" id="idUsuario">
        <div class="fila">
            <label>Usuario <input type="text" id="usuario" maxlength="35"></label>
            <label>Clave <input type="password" id="clave" maxlength="35"></label>
            <label>Nombre <input type="text" id="nombre" maxlength="85"></label>
            <label>Dirección <input type="text" id="direccion" maxlength="100"></label>
            <label>Teléfono <input type="text" id="telefono" maxlength="9" placeholder="0000-0000"></label>
        </div>
        <button class="verde" id="btnGuardar">Guardar</button>
        <button class="gris" id="btnLimpiar">Nuevo / Limpiar</button>
        <div id="msg"></div>
    </div>

    <div class="caja">
        <h2>Buscar usuarios</h2>
        <input type="text" id="txtBuscar" placeholder="Buscar por usuario, nombre, dirección o teléfono">
        <button class="azul" id="btnBuscar">Buscar</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Nombre</th>
                    <th>Dirección</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <script src="usuarios.js"></script>
</body>

</html>
